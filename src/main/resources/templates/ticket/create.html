<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create Ticket</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 40px;
            color: #2f3640;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 25px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #273c75;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            background-color: #273c75;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background-color: #192a56;
        }

        .navigation {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 25px;
        }

        .navigation a {
            color: #273c75;
            text-decoration: none;
            font-weight: 600;
        }

        .navigation a:hover {
            text-decoration: underline;
        }

        .submit-container {
            text-align: right;
            margin-top: 25px;
        }

        @media (max-width: 750px) {
            body {
                padding: 20px;
            }

            .container {
                padding: 20px;
            }

            .navigation {
                flex-direction: column;
                align-items: stretch;
            }

            .navigation a {
                text-align: center;
            }

            .submit-container {
                text-align: left;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Create Ticket</h1>

    <form th:action="@{/users/{userId}/tickets/create(userId=${userId})}"
          th:object="${ticket}"
          method="post">

        <div class="form-group">

            <label for="title">Title:</label>

            <input type="text"
                   id="title"
                   th:field="*{title}"
                   required>

        </div>

        <div class="form-group">

            <label for="description">Description:</label>

            <textarea id="description"
                      th:field="*{description}"
                      required></textarea>

        </div>

        <div class="form-group">

            <label for="agentId">Choose an Agent:</label>

            <select id="agentId"
                    name="agentId"
                    required>

                <option value="" disabled selected>
                    Select an agent
                </option>

                <option th:each="agent : ${agents}"
                        th:value="${agent.id}"
                        th:text="${agent.nickname}">
                </option>

            </select>

        </div>

        <div class="submit-container">

            <button type="submit">
                Create Ticket
            </button>

        </div>

    </form>

    <div class="navigation">

        <a th:href="@{/users/{userId}/read(userId=${userId})}">
            ← Back to Profile
        </a>

    </div>

</div>

</body>

</html>
