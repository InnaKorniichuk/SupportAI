<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create Ticket</title>
</head>

<body>

<h1>Create Ticket</h1>
<form th:action="@{/users/{userId}/tickets/create(userId=${userId})}"
      th:object="${ticket}"
      method="post">

    <label for="title">Title:</label>
    <input type="text"
           id="title"
           th:field="*{title}"
           required>

    <br><br>

    <label for="description">Description:</label>
    <textarea id="description"
              th:field="*{description}"
              required></textarea>

    <br><br>

    <button type="submit">Create Ticket</button>
</form>

<br>

<a th:href="@{/users/{userId}/read(userId=${userId})}">
    Back to Profile
</a>

<br>

<a th:href="@{/users/{id}/read(id=${id})}">
    Back to Profile
</a>

</body>
</html>
