<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ticket</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .ticket-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Ticket information */

        .ticket-header {
            padding: 25px 30px;
        }

        .ticket-header h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .ticket-info {
            display: grid;
            grid-template-columns: 120px 1fr;
            row-gap: 12px;
        }

        .ticket-info strong {
            color: #555;
        }

        /* Conversation */

        .conversation {
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            padding: 25px 30px;
        }

        .conversation h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .message {
            margin-bottom: 20px;
        }

        .message:last-child {
            margin-bottom: 0;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .message-sender {
            font-weight: bold;
        }

        .message-date {
            color: #888;
            font-size: 13px;
        }

        .message-content {
            background-color: #f1f1f1;
            padding: 12px 15px;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .no-messages {
            color: #888;
            text-align: center;
            padding: 20px 0;
        }

        /* Send message */

        .send-message {
            padding: 25px 30px;
        }

        .send-message h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea:focus {
            outline: none;
            border-color: #888;
        }

        .send-button-container {
            text-align: right;
            margin-top: 12px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Bottom navigation */

        .navigation {
            padding: 20px 30px;
            border-top: 1px solid #ddd;
        }

        .navigation a {
            margin-right: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="ticket-container">

    <!-- Ticket information -->

    <div class="ticket-header">

        <h1>
            Ticket #
            <span th:text="${ticket.id}"></span>
        </h1>

        <div class="ticket-info">

            <strong>Title:</strong>
            <span th:text="${ticket.title}"></span>

            <strong>Status:</strong>
            <span th:text="${ticket.ticketStatus}"></span>

            <strong>Created:</strong>
            <span th:text="${#temporals.format(
                    ticket.createdAt,
                    'dd.MM.yyyy HH:mm')}">
            </span>

            <strong>Customer:</strong>

            <span th:if="${ticket.customer != null}"
                  th:text="${ticket.customer.nickname}">
            </span>

            <span th:if="${ticket.customer == null}">
                -
            </span>

            <strong>Agent:</strong>

            <span th:if="${ticket.assignedAgent != null}"
                  th:text="${ticket.assignedAgent.nickname}">
            </span>

            <span th:if="${ticket.assignedAgent == null}">
                Not assigned
            </span>

            <strong>Description:</strong>
            <span th:text="${ticket.description}"></span>

        </div>

    </div>


    <!-- Conversation -->

    <div class="conversation">

        <h2>Conversation</h2>

        <div th:if="${#lists.isEmpty(ticket.messages)}"
             class="no-messages">

            No messages yet. Start the conversation below.

        </div>

        <div th:each="message : ${ticket.messages}"
             class="message">

            <div class="message-header">

                <span class="message-sender"
                      th:text="${message.sender.nickname}">
                    User
                </span>

                <span class="message-date"
                      th:text="${#temporals.format(
                              message.sentAt,
                              'dd.MM.yyyy HH:mm')}">
                    12.08.2026 10:15
                </span>

            </div>

            <div class="message-content"
                 th:text="${message.content}">
                Message content
            </div>

        </div>

    </div>


    <!-- Send message -->

    <div class="send-message">

        <h2>Send Message</h2>

        <form th:action="@{/users/{userId}/tickets/{ticketId}/messages/create(
                            userId=${ticket.customer.id},
                            ticketId=${ticket.id})}"
              th:object="${message}"
              method="post">

            <textarea
                    th:field="*{content}"
                    placeholder="Write a message..."
                    required>
            </textarea>

            <div class="send-button-container">

                <button type="submit">
                    Send Message
                </button>

            </div>

        </form>

    </div>


    <!-- Navigation -->

    <div class="navigation">

        <a th:href="@{/users/{userId}/read(
                        userId=${ticket.customer.id})}">
            ← Back to Profile
        </a>

        <form th:action="@{/logout}"
              method="post"
              style="display: inline;">

            <button type="submit">
                Logout
            </button>

        </form>

    </div>

</div>

</body>
</html>
