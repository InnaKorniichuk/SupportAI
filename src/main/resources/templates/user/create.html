<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
</head>
<body>

<h1>Create Account</h1>

<form th:action="@{/users/create}"
      th:object="${user}"
      method="post">

    <div>
        <label for="nickname">Nickname:</label>
        <input type="text"
               id="nickname"
               th:field="*{nickname}"
               required>
    </div>

    <div>
        <label for="email">Email:</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               required>
    </div>

    <div>
        <label for="password">Password:</label>
        <input type="password"
               id="password"
               th:field="*{password}"
               required>
    </div>

    <button type="submit">Create Account</button>

</form>

</body>
</html>
