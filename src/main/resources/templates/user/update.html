<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
</head>
<body>

<h1>Edit Profile</h1>

<div>
    <p>
        <strong>Current nickname:</strong>
        <span th:text="${user.nickname}"></span>
    </p>

    <p>
        <strong>Current email:</strong>
        <span th:text="${user.email}"></span>
    </p>
</div>

<form th:action="@{/users/{id}/update(id=${user.id})}"
      th:object="${userUpdate}"
      method="post">

    <div>
        <label for="nickname">Nickname:</label>
        <input type="text"
               id="nickname"
               th:field="*{nickname}"
               required>
    </div>

    <div>
        <label for="email">Email:</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               required>
    </div>

    <div>
        <label for="password">New Password:</label>
        <input type="password"
               id="password"
               th:field="*{password}">
    </div>

    <button type="submit">Save Changes</button>

</form>

<br>

<a th:href="@{/users/{id}/read(id=${user.id})}">
    Cancel
</a>

</body>
</html>
