<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
</head>

<body>

<h1>User Profile</h1>

<div>
    <p>
        <strong>Nickname:</strong>
        <span th:text="${user.nickname}"></span>
    </p>

    <p>
        <strong>Email:</strong>
        <span th:text="${user.email}"></span>
    </p>

    <p>
        <strong>Role:</strong>
        <span th:text="${user.role}"></span>
    </p>
</div>

<hr>

<h2>Tickets</h2>

<div th:if="${#lists.isEmpty(tickets)}">
    <p>No tickets found.</p>
</div>

<table th:unless="${#lists.isEmpty(tickets)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Status</th>
        <th>Created At</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="ticket : ${tickets}">

        <td th:text="${ticket.id}"></td>

        <td th:text="${ticket.title}"></td>

        <td th:text="${ticket.ticketStatus}"></td>

        <td th:text="${#temporals.format(ticket.createdAt, 'dd.MM.yyyy HH:mm')}"></td>

        <td>
            <a th:href="@{/users/{userId}/tickets/{ticketId}/read(
                    userId=${user.id},
                    ticketId=${ticket.id})}">
                Read
            </a>

            &nbsp;

            <form th:action="@{/users/{userId}/tickets/{ticketId}/delete(
                        userId=${user.id},
                        ticketId=${ticket.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit"
                        onclick="return confirm('Are you sure you want to delete this ticket?');">
                    Delete
                </button>

            </form>

            <form th:action="@{/users/{userId}/tickets/{ticketId}/changestatus(
                    userId=${user.id},
                    ticketId=${ticket.id})}"
                  method="post">

                <select name="status">
                    <option value="OPEN">Open</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="RESOLVED">Resolved</option>
                    <option value="CLOSED">Closed</option>
                </select>

                <button type="submit">Change Status</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<br>

<a th:href="@{/users/{userId}/tickets/create(userId=${user.id})}">
    Create Ticket
</a>

<br><br>

<a th:href="@{/users/{id}/update(id=${user.id})}">
    Edit Profile
</a>

<br><br>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
