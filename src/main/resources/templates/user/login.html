<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #2f3640;
        }

        .container {
            background-color: white;
            width: 380px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 25px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #273c75;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #273c75;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        button:hover {
            background-color: #192a56;
        }

        .error {
            color: #e84118;
            background-color: #fdecea;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 18px;
        }

        .message {
            color: #218c74;
            background-color: #eafaf5;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 18px;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #57606f;
        }

        .register a {
            color: #273c75;
            text-decoration: none;
            font-weight: 600;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Login</h1>

    <div th:if="${param.error}" class="error">
        Invalid email or password.
    </div>

    <div th:if="${param.logout}" class="message">
        You have been logged out.
    </div>

    <form th:action="@{/users/login}" method="post">

        <div class="form-group">
            <label for="username">Email</label>
            <input
                    type="email"
                    id="username"
                    name="username"
                    placeholder="Enter your email"
                    required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        Don't have an account?
        <a th:href="@{/users/create}">Register</a>
    </div>

</div>

</body>

</html>
