<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #555;
        }

        .error {
            color: #d00;
            text-align: center;
            margin-bottom: 15px;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            text-decoration: none;
        }
    </style>

</head>

<body>

<div class="login-container">

    <h1>Login</h1>

    <div th:if="${param.error}" class="error">
        Invalid email or password.
    </div>

    <div th:if="${param.logout}" class="message">
        You have been logged out.
    </div>

    <form th:action="@{/users/login}" method="post">

        <div class="form-group">
            <label for="username">Email</label>
            <input
                    type="email"
                    id="username"
                    name="username"
                    placeholder="Enter your email"
                    required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        Don't have an account?
        <a th:href="@{/users/create}">Register</a>
    </div>

</div>

</body>
</html>
