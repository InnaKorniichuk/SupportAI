<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #2f3640;
    }

    .container {
      background-color: white;
      width: 400px;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #dcdde1;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #273c75;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    button,
    .cancel {
      flex: 1;
      padding: 11px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    button {
      border: none;
      background-color: #273c75;
      color: white;
    }

    button:hover {
      background-color: #192a56;
    }

    .cancel {
      border: 1px solid #dcdde1;
      color: #2f3640;
      background-color: #f1f2f6;
    }

    .cancel:hover {
      background-color: #dcdde1;
    }
  </style>

</head>

<body>

<div class="container">

  <h1>Edit Profile</h1>

  <form th:action="@{/users/{id}/update(id=${user.id})}"
        th:object="${userUpdate}"
        method="post">

    <div class="form-group">
      <label for="nickname">Nickname</label>
      <input type="text"
             id="nickname"
             th:field="*{nickname}"
             required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email"
             id="email"
             th:field="*{email}"
             required>
    </div>

    <div class="form-group">
      <label for="password">New Password</label>
      <input type="password"
             id="password"
             th:field="*{password}">
    </div>

    <div class="buttons">
      <button type="submit">Save Changes</button>

      <a class="cancel"
         th:href="@{/users/{id}/read(id=${user.id})}">
        Cancel
      </a>
    </div>

  </form>

</div>

</body>
</html>
