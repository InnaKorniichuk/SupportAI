<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Agent Service</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 40px;
            color: #2f3640;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 25px;
            font-size: 28px;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 18px;
            font-size: 21px;
        }

        .profile {
            background-color: #f1f2f6;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .profile p {
            margin: 10px 0;
        }

        .profile strong {
            display: inline-block;
            width: 100px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th {
            background-color: #f1f2f6;
            text-align: left;
            padding: 14px;
            font-size: 14px;
            color: #57606f;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e5e5;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #fafafa;
        }

        a {
            color: #273c75;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .read-button {
            display: inline-block;
            padding: 8px 14px;
            background-color: #273c75;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .read-button:hover {
            background-color: #192a56;
            text-decoration: none;
        }

        .empty {
            background-color: #f1f2f6;
            padding: 18px;
            border-radius: 8px;
            color: #57606f;
        }

        .navigation {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 25px;
        }

        .navigation .primary {
            display: inline-block;
            padding: 11px 18px;
            background-color: #273c75;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }

        .navigation .primary:hover {
            background-color: #192a56;
            text-decoration: none;
        }

        .logout {
            margin-top: 15px;
        }

        .logout button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background-color: #57606f;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout button:hover {
            background-color: #353b48;
        }

        @media (max-width: 750px) {

            body {
                padding: 20px;
            }

            .container {
                padding: 20px;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            .navigation {
                flex-direction: column;
                align-items: stretch;
            }

            .navigation a {
                text-align: center;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Agent Service</h1>

    <div class="profile">

        <p>
            <strong>Nickname:</strong>
            <span th:text="${user.nickname}"></span>
        </p>

        <p>
            <strong>Email:</strong>
            <span th:text="${user.email}"></span>
        </p>

        <p>
            <strong>Role:</strong>
            <span th:text="${user.role}"></span>
        </p>

    </div>


    <h2>My Assigned Tickets</h2>


    <div th:if="${#lists.isEmpty(tickets)}"
         class="empty">

        <p>You currently have no assigned tickets.</p>

    </div>


    <table th:unless="${#lists.isEmpty(tickets)}">

        <thead>

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Created At</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="ticket : ${tickets}">

            <td th:text="${ticket.id}"></td>

            <td th:text="${ticket.title}"></td>

            <td th:text="${ticket.ticketStatus}"></td>

            <td th:text="${#temporals.format(
                    ticket.createdAt,
                    'dd.MM.yyyy HH:mm')}">
            </td>

            <td>

                <a class="read-button"
                   th:href="@{/users/{userId}/tickets/{ticketId}/read(
                       userId=${user.id},
                       ticketId=${ticket.id})}">
                    Open Ticket
                </a>

            </td>

        </tr>

        </tbody>

    </table>


    <div class="navigation">

        <a class="primary"
           th:href="@{/agent/service}">
            Refresh
        </a>

    </div>


    <form class="logout"
          th:action="@{/logout}"
          method="post">

        <button type="submit">
            Logout
        </button>

    </form>

</div>

</body>

</html>
