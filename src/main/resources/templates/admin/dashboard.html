<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 40px;
            color: #2f3640;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: #f1f2f6;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h2 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #57606f;
        }

        .stat-card p {
            margin: 0;
            font-size: 30px;
            font-weight: bold;
            color: #273c75;
        }

        .navigation {
            display: flex;
            gap: 15px;
        }

        .navigation a {
            display: inline-block;
            padding: 12px 20px;
            background-color: #273c75;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .navigation a:hover {
            background-color: #192a56;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .navigation {
                flex-direction: column;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <div class="stats">

        <div class="stat-card">
            <h2>Total Users</h2>
            <p th:text="${totalUsers}"></p>
        </div>

        <div class="stat-card">
            <h2>Customers</h2>
            <p th:text="${customers}"></p>
        </div>

        <div class="stat-card">
            <h2>Agents</h2>
            <p th:text="${agents}"></p>
        </div>

        <div class="stat-card">
            <h2>Admins</h2>
            <p th:text="${admins}"></p>
        </div>

    </div>

    <div class="navigation">

        <a href="/admin/users">Manage Users</a>

        <a href="/admin/tickets">View Tickets</a>

    </div>

</div>

</body>

</html>
